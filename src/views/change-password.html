<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpaka</title>
    <link rel="icon" href="../../public/favicon.ico" type="image/x-icon" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.3/purify.js"></script>
  </head>

  <body>
    <div class="password-change-container">
      <div id="error-message" style="color: red; display: none"></div>
      <!-- post data to /register endpoint when submit button is clicked -->
      <form id="change-password-form">
        <label for="old-password">Old Password:</label><br />
        <input type="password" name="old-password" /><br />
        <label for="new-password">New Password:</label><br />
        <input type="password" name="new-password" /><br />
        <label for="confirm-password">New Password:</label><br />
        <input type="password" name="confirm-password" />

        <br /><br />
        <button type="submit">Change password</button>
      </form>
    </div>
    <script type="text/javascript" src="src/purify.js"></script>
    <script>
      document
        .getElementById("change-password-form")
        .addEventListener("submit", function (e) {
          e.preventDefault(); // Prevent the form from submitting the traditional way

          const formData = new FormData(this);
          const oldPassword = formData.get("old-password");
          const newPassword = formData.get("new-password");
          const confirmPassword = formData.get("confirm-password");

          // frontend validation: do new passwords match ?
          if (newPassword !== confirmPassword) {
            document.getElementById("error-message").textContent =
              "Passwords do not match";
            document.getElementById("error-message").style.display = "block"; // dynamically render error
            return;
          }

          document.getElementById("error-message").style.display = "none";

          const postData = {
            "old-password": oldPassword,
            "new-password": newPassword,
            "confirm-password": confirmPassword,
          };

          fetch("/change-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(postData),
          })
            .then((response) => {
              if (!response.ok) {
                return response.text().then((errorText) => {
                  // You could also return JSON if the server sends JSON error responses
                  throw new Error(errorText); // Or customize the message as needed
                });
              }
              return response.text();
            })
            .then((html) => {
              const clean = DOMPurify.sanitize(html);
              document.body.innerHTML = clean;
            })
            .catch((error) => {
              console.error("Error:", error);
              document.getElementById("error-message").textContent =
                error.message || "Something went wrong. Please try again.";
              document.getElementById("error-message").style.display = "block";
            });
        });
    </script>
  </body>
</html>
